  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1px solid rgba(242,250,250,.25);min-height:48px;box-sizing:border-box;transition:transform .18s ease,border-color .2s ease\" style-hover=\"transform:translateY(-2px);border-color:rgba(242,250,250,.55);color:#F2FAFA\">Ver soluções<\u002Fa>\n            <\u002Fdiv>\n            <div style=\"display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:13.5px;color:#9FB3B3\"><span style=\"width:8px;height:8px;border-radius:50%;background:#00CBCC;box-shadow:0 0 10px #00CBCC\"><\u002Fspan>Resposta no mesmo dia · sem compromisso<\u002Fdiv>\n            <div aria-hidden=\"true\" style=\"display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:clamp(20px,4vh,44px);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#9FB3B3\">\n              <span>Role para explorar<\u002Fspan>\n              <span style=\"width:1px;height:30px;background:linear-gradient(#00CBCC,transparent);animation:zyPulse 1.8s ease-in-out infinite\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ================= DOR (painel 2) ================= -->\n    <section class=\"zy-panel\" id=\"dor\" data-screen-label=\"A dor\" aria-labelledby=\"dor-titulo\" style=\"min-height:100svh;display:flex;align-items:center;background:#121B1B;padding:88px 24px 48px;box-sizing:border-box;box-shadow:0 -30px 60px -40px rgba(0,0,0,.55)\">\n      <div style=\"max-width:1180px;margin-inline:auto;width:100%\">\n        <div class=\"zy-reveal\" style=\"max-width:680px;margin-bottom:36px\">\n          <div style=\"display:inline-flex;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#00CBCC;background:rgba(0,203,204,.14);padding:6px 14px;border-radius:100px;margin-bottom:16px\">A dor<\u002Fdiv>\n          <h2 id=\"dor-titulo\" style=\"margin:0;font-family:Sora,sans-serif;font-weight:700;font-size:clamp(1.8rem,3.8vw,2.5rem);line-height:1.12;letter-spacing:-0.02em\">A tecnologia devia ajudar, não travar o seu dia.<\u002Fh2>\n          <p style=\"margin:14px 0 0;color:#9FB3B3;font-size:1.05rem;line-height:1.7\">Se algum desses cenários soa familiar, você está no lugar certo. A Zyphy existe para resolver exatamente isso.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:20px\">\n          <article class=\"zy-reveal\" style=\"background:#1B2626;border:1px solid rgba(242,250,250,.1);border-radius:20px;padding:30px\">\n            <span aria-hidden=\"true\" style=\"width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(0,203,204,.14);color:#00CBCC;margin-bottom:16px\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 8v4l3 3\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n            <h3 style=\"margin:0 0 6px;font-family:Sora,sans-serif;font-weight:700;font-size:1.12rem\">Tarefas manuais sem fim<\u002Fh3>\n            <p style=\"margin:0;color:#9FB3B3;font-size:.95rem;line-height:1.65\">Planilhas, copiar e colar, retrabalho. Horas preciosas gastas no que uma automação resolveria em segundos.<\u002Fp>\n          <\u002Farticle>\n          <article class=\"zy-reveal\" data-delay=\"1\" style=\"background:#1B2626;border:1px solid rgba(242,250,250,.1);border-radius:20px;padding:30px\">\n            <span aria-hidden=\"true\" style=\"width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(0,203,204,.14);color:#00CBCC;margin-bottom:16px\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M  <div style=\"max-width:1180px;margin-inline:auto;width:100%\">\n        <div class=\"zy-reveal\" style=\"max-width:680px;margin-bottom:36px\">\n          <div style=\"display:inline-flex;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#00CBCC;background:rgba(0,203,204,.14);padding:6px 14px;border-radius:100px;margin-bottom:16px\">A solução<\u002Fdiv>\n          <h2 id=\"sol-titulo\" style=\"margin:0;font-family:Sora,sans-serif;font-weight:700;font-size:clamp(1.8rem,3.8vw,2.5rem);line-height:1.12;letter-spacing:-0.02em\">Soluções sob medida, do problema ao resultado.<\u002Fh2>\n          <p style=\"margin:14px 0 0;color:#9FB3B3;font-size:1.05rem;line-height:1.7\">Nada de produto engessado. Entendemos o seu contexto e construímos exatamente o que faz sentido para você.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:20px\">\n          <article class=\"zy-reveal\" style=\"background:#1B2626;border:1px solid rgba(242,250,250,.08);border-top:3px solid #00CBCC;border-radius:20px;padding:30px;box-shadow:0 12px 30px -22px rgba(0,0,0,.55);transition:transform .25s ease\" style-hover=\"transform:translateY(-4px)\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:#00CBCC;margin-bottom:14px\">01 /<\u002Fdiv>\n            <h3 style=\"margin:0 0 8px;font-family:Sora,sans-serif;font-weight:700;font-size:1.2rem\">Automação de processos<\u002Fh3>\n            <p style=\"margin:0;color:#9FB3B3;font-size:.95rem;line-height:1.65\">Transformamos tarefas manuais e repetitivas em fluxos automáticos. Menos erro, mais tempo para o que importa.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:20px\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9FB3B3;border:1px solid rg uot;,&quot;default&quot;:900,&quot;min&quot;:200,&quot;max&quot;:3000,&quot;step&quot;:50,&quot;unit&quot;:&quot;ms&quot;,&quot;section&quot;:&quot;Intro&quot;},&quot;tempoEstatico&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2000,&quot;min&quot;:0,&quot;max&quot;:8000,&quot;step&quot;:250,&quot;unit&quot;:&quot;ms&quot;,&quot;section&quot;:&quot;Intro&quot;},&quot;momentoDoTremor&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.86,&quot;min&quot;:0.5,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;section&quot;:&quot;Intro&quot;},&quot;pularIntro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Intro&quot;}}\">\nclass Component extends DCLogic {\n  state = { menuOpen: false, statusMsg: \"\", statusColor: \"#00CBCC\" };\n\n  renderVals() {\n    return {\n      menuOpen: this.state.menuOpen,\n      statusMsg: this.state.statusMsg,\n      statusColor: this.state.statusColor,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      onSubmit: (e) => this.handleSubmit(e)\n    };\n  }\n\n  handleSubmit(e) {\n    e.preventDefault();\n    const form = e.target;\n    const nome = form.nome.value.trim();\n    const contato = form.contato.value.trim();\n    const msg = form.mensagem.value.trim();\n    if (!nome || !contato) {\n      this.setState({ statusColor: \"#c0392b\", statusMsg: \"Preencha seu nome e um e-mail ou WhatsApp para continuar.\" });\n      (!nome ? form.nome : form.contato).focus();\n      return;\n    }\n    const texto = encodeURIComponent(\n      \"Olá! Sou \" + nome + \" (\" + contato + \").\" + (msg ? \"\\n\\nO que quero resolver: \" + msg : \"\\n\\nQuero começar um projeto com a Zyphy.\")\n    );\n    window.open(\"https://wa.me/5511977176036?text=\" + texto, \"_blank\", \"noopener\");\n    this.setState({ statusColor: \"#00CBCC\", statusMsg: \"Abrindo o WhatsApp… A Zyphy responde ainda hoje!\" });\n    form.reset();\n  }\n\n  /* ---------- malha animada (linhas interligadas) ---------- */\n  initPlexus(canvas) {\n    if (!canvas) return;\n    const ctx = canvas.getContext(\"2d\");\n    let w = 0, h = 0, parts = [], raf = 0, running = false;\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n\n    const resize = () => {\n      const r = canvas.getBoundingClientRect();\n      w = r.width; h = r.height;\n      canvas.width = w * dpr; canvas.height = h * dpr;\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      const n = Math.max(24, Math.min(70, Math.round((w * h) / 22000)));\n      parts = Array.from({ length: n }, () => ({\n        x: Math.random() * w, y: Math.random() * h,\n        vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35\n      }));\n    };\n\n    const LINK = 130;\n    const tick = () => {\n      ctx.clearRect(0, 0, w, h);\n      for (const p of parts) {\n        p.x += p.vx; p.y += p.vy;\n        if (p.x < 0 || p.x > w) p.vx *= -1;\n        if (p.y < 0 || p.y > h) p.vy *= -1;\n      }\n      for (let i = 0; i < parts.length; i++) {\n        for (let j = i + 1; j < parts.length; j++) {\n          const dx = parts[i].x - parts[j].x, dy = parts[i].y - parts[j].y;\n          const d = Math.hypot(dx, dy);\n          if (d < LINK) {\n            ctx.strokeStyle = \"rgba(0,203,204,\" + (0.16 * (1 - d / LINK)).toFixed(3) + \")\";\n            ctx.lineWidth = 1;\n            ctx.beginPath(); ctx.moveTo(parts[i].x, parts[i].y); ctx.lineTo(parts[j].x, parts[j].y); ctx.stroke();\n          }\n        }\n      }\n      ctx.fillStyle = \"rgba(0,203,204,.45)\";\n      for (const p of parts) { ctx.beginPath(); ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2); ctx.fill(); }\n      if (running) raf = requestAnimationFrame(tick);\n    };\n\n    const start = () => { if (!running) { running = true; raf = requestAnimationFrame(tick); } };\n    const stop = () => { running = false; cancelAnimationFrame(raf); };\n\n    resize();\n    const ro = new ResizeObserver(resize);\n    ro.observe(canvas);\n    const io = new IntersectionObserver((en) => en.forEach(x => x.isIntersecting ? start() : stop()), { threshold: 0.05 });\n    io.observe(canvas);\n    this._cleanup.push(() => { stop(); ro.disconnect(); io.disconnect(); });\n  }\n\n  componentDidMount() {\n    this._cleanup = [];\n    const doc = document;\n    const docEl = doc.documentElement;\n    const reduce = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n    /* ---------- refs ---------- */\n    const header = doc.getElementById(\"zyHeader\");\n    const heroCard = doc.getElementById(\"zyHeroCard\");\n    const logoEl = doc.getElementById(\"zyLogo\");\n    const zEl = doc.getElementById(\"zyZ\");\n    const zInner = doc.getElementById(\"zyZInner\");\n    const restEl = doc.getElementById(\"zyRest\");\n    const heroContent = doc.getElementById(\"zyHeroContent\");\n    if (!header || !zEl || !restEl) return;\n\n    /* ---------- malha animada ---------- */\n    if (!reduce) {\n      this.initPlexus(doc.getElementById(\"zyPlexusHero\"));\n      this.initPlexus(doc.getElementById(\"zyPlexusCta\"));\n    }\n\n    /* ---------- calibragem (props ajustáveis) ---------- */\n    const WAIT = this.props.esperaAntesDoVoo ?? 1250;\n    const FLIGHT = this.props.duracaoDoVoo ?? 900;\n    const HOLD = this.props.tempoEstatico ?? 2000;\n    const TREMBLE_AT = this.props.momentoDoTremor ?? 0.86;\n    const skip = this.props.pularIntro ?? false;\n\n    /* ---------- intro (auto, sem depender de scroll) ---------- */\n    let progress = 0, hitDone = false, restW = 0, zBig = 0, zFinal = 0;\n\n    const computeSizes = () => {\n      const cw = heroCard ? heroCard.clientWidth : window.innerWidth;\n      zBig = Math.min(Math.max(cw * 0.28, 90), 190);\n      zFinal = Math.min(Math.max(cw * 0.12, 44), 84);  // tamanho final = igual ao \"yphy\"\n      restEl.style.fontSize = zFinal + \"px\";\n    };\n    const measureRest = () => { restW = restEl.getBoundingClientRect().width; };\n\n    const triggerTremble = () => {\n      zInner.style.animation = \"none\";\n      void zInner.offsetWidth;\n      zInner.style.animation = \"zyTremble .5s ease-out\";\n    };\n\n    const revealContent = () => {\n      heroContent.style.opacity = \"1\";\n      heroContent.style.transform = \"translateY(0)\";\n      header.style.opacity = \"1\";\n      header.style.transform = \"translateY(0)\";\n    };\n\n    const applyProgress = (p) => {\n      p = Math.max(0, Math.min(1, p));\n      progress = p;\n      zEl.style.fontSize = (zBig - (zBig - zFinal) * p) + \"px\";\n      logoEl.style.transform = \"translateX(\" + (restW / 2) * (1 - p) + \"px)\";\n      const flyDist = (heroCard ? heroCard.clientWidth : window.innerWidth) * 0.7;\n      restEl.style.transform = \"translateX(\" + flyDist * (1 - p) + \"px)\";\n      if (p >= TREMBLE_AT && !hitDone) { hitDone = true; triggerTremble(); }\n      if (p > 0.6) revealContent();\n    };\n\n    const lockScroll = () => { docEl.classList.add(\"intro-lock\"); window.scrollTo(0, 0); };\n    const unlock = () => docEl.classList.remove(\"intro-lock\");\n    this._cleanup.push(unlock);\n\n    const tweenTo = (target, duration, done) => {\n      const start = progress, t0 = performance.now();\n      const frame = (now) => {\n        const k = Math.min(1, (now - t0) / duration);\n        applyProgress(start + (target - start) * (1 - Math.pow(1 - k, 3)));\n        if (k < 1) requestAnimationFrame(frame);\n        else if (done) done();\n      };\n      requestAnimationFrame(frame);\n    };\n\n    const init = () => {\n      computeSizes();\n      measureRest();\n      if (reduce || skip) {\n        zEl.style.opacity = \"1\";\n        applyProgress(1);\n        return;\n      }\n      applyProgress(0);\n      lockScroll();\n      zEl.style.animation = \"zyThrow 1.3s both\";\n      zEl.addEventListener(\"animationend\", (ev) => { if (ev.animationName === \"zyThrow\") zEl.style.opacity = \"1\"; }, { once: true });\n      const t1 = setTimeout(() => {\n        tweenTo(1, FLIGHT, () => { const t2 = setTimeout(unlock, HOLD); this._cleanup.push(() => clearTimeout(t2)); });\n      }, WAIT);\n      this._cleanup.push(() => clearTimeout(t1));\n    };\n\n    const onResize = () => { computeSizes(); measureRest(); applyProgress(progress); };\n    window.addEventListener(\"resize\", onResize);\n    this._cleanup.push(() => window.removeEventListener(\"resize\", onResize));\n\n    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(init);\n    else init();\n\n    /* ---------- header: sombra + barra de progresso ---------- */\n    const progressBar = doc.getElementById(\"zyProgress\");\n    const onScroll = () => {\n      const scrolled = window.scrollY > 8;\n      header.style.borderBottomColor = scrolled ? \"rgba(242,250,250,.08)\" : \"transparent\";\n      header.style.boxShadow = scrolled ? \"0 12px 30px -22px rgba(0,0,0,.55)\" : \"none\";\n      if (progressBar) {\n        const docH = docEl.scrollHeight - window.innerHeight;\n        progressBar.style.width = (docH > 0 ? (window.scrollY / docH) * 100 : 0) + \"%\";\n      }\n    };\n    window.addEventListener(\"scroll\", onScroll, { passive: true });\n    onScroll();\n    this._cleanup.push(() => window.removeEventListener(\"scroll\", onScroll));\n\n    /* ---------- scroll reveal ---------- */\n    const revealEls = doc.querySelectorAll(\".zy-reveal\");\n    if (\"IntersectionObserver\" in window && !reduce) {\n      const io = new IntersectionObserver((entries, obs) => {\n        entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add(\"on\"); obs.unobserve(en.target); } });\n      }, { threshold: 0.15, rootMargin: \"0px 0px -40px 0px\" });\n      revealEls.forEach(el => io.observe(el));\n      this._cleanup.push(() => io.disconnect());\n    } else {\n      revealEls.forEach(el => el.classList.add(\"on\"));\n    }\n\n    /* ---------- palavra rotativa ---------- */\n    const rotator = doc.getElementById(\"zyRotator\");\n    if (rotator && !reduce) {\n      const words = [\"seu site\", \"seu app\", \"sua ferramenta\", \"sua operação\", \"sua ideia\", \"sua presença\"];\n      let i = 0;\n      const iv = setInterval(() => {\n        const cur = rotator.firstElementChild;\n        const next = doc.createElement(\"span\");\n        next.textContent = words[(i + 1) % words.length];\n        next.style.cssText = \"position:absolute;left:0;top:0;color:#00CBCC;opacity:0;transform:translateY(100%)\";\n        rotator.appendChild(next);\n        void next.offsetWidth;\n        next.style.transition = \"opacity .5s ease,transform .5s ease\";\n        next.style.opacity = \"1\";\n        next.style.transform = \"translateY(0)\";\n        if (cur) {\n          cur.style.transition = \"opacity .5s ease,transform .5s ease\";\n          cur.style.opacity = \"0\";\n          cur.style.transform = \"translateY(-100%)\";\n          setTimeout(() => cur.remove(), 550);\n        }\n        i = (i + 1) % words.length;\n      }, 2500);\n      this._cleanup.push(() => clearInterval(iv));\n    }\n  }\n\n  componentWillUnmount() {\n    (this._cleanup || []).forEach(fn => { try { fn(); } catch (e) {} });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
